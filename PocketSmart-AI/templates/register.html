<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | PocketSmart AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                Pocket<span>Smart</span> AI
            </div>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Start managing your money smarter.
            </p>

            <form action="/register" method="POST">

                <label>Name</label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </div>

    </div>

</body>
</html>
