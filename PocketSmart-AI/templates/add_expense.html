<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Expense | PocketSmart AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                Pocket<span>Smart</span> AI
            </div>

            <h1>Add Expense</h1>

            <p class="auth-subtitle">
                Record your spending
            </p>

            <form action="/add-expense" method="POST">

                <label>Category</label>

                <select name="category" required>

                    <option value="">Select category</option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <label>Amount</label>

                <input
                    type="number"
                    name="amount"
                    placeholder="₹ Enter amount"
                    min="1"
                    step="0.01"
                    required
                >


                <label>Description</label>

                <input
                    type="text"
                    name="description"
                    placeholder="Example: Lunch"
                >


                <button type="submit">
                    Save Expense
                </button>

            </form>

            <p class="auth-footer">

                <a href="/dashboard">
                    ← Back to Dashboard
                </a>

            </p>

        </div>

    </div>

</body>

</html>
